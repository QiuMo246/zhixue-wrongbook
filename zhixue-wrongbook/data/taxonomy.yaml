# 知识点受控词表（taxonomy）
#
# 作用：submit_analysis 提交的知识点必须能在这里找到，找不到直接拒绝。
#       —— 这是「知识点标注」防幻觉的硬闸门，见架构文档 8.2。
#
# 层级：学科 / 章节 / 知识点
# 规范路径写法：数学/一元二次方程/公式法与判别式
# 校验时也接受「章节/知识点」两段写法（如 一元二次方程/公式法与判别式），
# 但要求在该学科内唯一命中；命中多个或零个都会拒绝并返回候选。
#
# 维护方式：直接改本文件即可，不需要改代码。
# 版本：version 字段目前**只是标记，没有被代码使用**（core/taxonomy.py 读了它
#       但没有任何校验依赖它）。所以「增补章节」不会让旧分析结果失效 ——
#       只有「改掉/删掉已有的知识点名」才会让旧结果对不上。
#       改这个字段的意义是留痕：日后想追溯「这份分析是哪一版词表下的产物」有据可查。

version: 6
updated_at: "2026-10-18"

subjects:
