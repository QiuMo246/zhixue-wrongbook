  # ==========================================================================
  # 历史 / 道法（2026-09-25 补录）
  #
  # 【为什么章节按「内容主题」划分，而不按教材单元名】
  #
  # 起因：用户要求「补历史/道法的知识点章节」。查证时发现一个硬事实 ——
  # **统编版初中教材正在换新版**，单元/课题名变动很大。实测两版对比：
  #
  #   道法八上  旧版：第一单元 走进社会生活 / 第二单元 遵守社会规则
  #             新版：第一单元 走进社会生活 / 第二单元 维护社会秩序
  #                   （且「追求自由平等」「维护公平正义」从八下移到了八上）
  #   历史八上  旧版：第8课 革命先行者孙中山 / 第9课 辛亥革命
  #             新版：第8课 中国同盟会 / 第9课 辛亥革命
  #
  # 如果把单元/课题名写进词表，学校一换教材版本，这些路径就全部对不上，
  # submit_analysis 会成片地拒绝 —— 而词表本来是「改起来最省事」的东西，
  # 不该变成需要跟着教材追着改的东西。
  #
  # 所以这里用**内容主题**做章节名（断代 / 内容板块），它跨版本稳定；
  # 知识点用**具体考点**（事件、条约、制度、概念），这是错题真正被标注的东西。
  # 代价说清楚：章节粒度比教材单元粗一点，`check_practice` 的「超纲检查」
  # 在历史/道法上会宽松一些。这个取舍是知情的，不是没想到。
  #
  # 【依据】
  #   - 历史：2022 版义务教育历史课程标准的内容板块（中国古代史 / 中国近代史 /
  #     中国现代史 / 世界古代史 / 世界近代史 / 世界现代史）+ 部编版教材主干
  #   - 道法：2022 版义务教育道德与法治课程标准的内容要求
  #     （生命安全与健康教育 / 道德教育 / 法治教育 / 中华优秀传统文化教育 /
  #      革命传统教育 / 国情教育）+ 部编版教材主干
  #
  # 【维护】发现词表里没有的考点，直接在对应章节的 points 下加一行即可。
  # ==========================================================================

