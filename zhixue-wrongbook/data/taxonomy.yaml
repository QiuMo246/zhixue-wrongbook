      # ======================================================================
      # 2026-10-18 补全数学词表（原 17 章 63 点 → 26 章 118 点）
      #
      # 【为什么补】翻题库里 45 道数学错题的真实题干，发现三类考点
      #   在旧词表里根本落不下去：
      #     1) 「图形的平移与旋转」「中心对称」—— 有证明题整道围绕
      #        绕对称中心旋转构造，词表只有「轴对称图形」，对不上。
      #     2) 「分段函数」「函数图象与性质」—— 题干明确「这种函数称为
      #        分段函数」，旧词表只有一次/二次/反比例三个具体函数，
      #        没有函数总论这一层。
      #     3) 「数据的收集与分析」（平均数/中位数/众数/方差）—— 只有
      #        九年级「统计与概率」一章笼统带过。
      #   另外七年级内容（有理数、整式加减、一元一次方程、平行线、
      #   三角形初步、不等式）整段缺失，现在也只有八下以后能覆盖。
      #
      # 【划分】按苏科版七上→九下教材主线，与物理一致地「按教材章节」。
      #   保留原有全部 17 章与 63 个考点名不动 —— 历史分析照旧可校验。
      # ======================================================================

