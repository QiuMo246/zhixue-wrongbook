          - 力与运动的关系
          - 平衡力与相互作用力的辨析
      - name: 压强
        points:
          - 压力与压强
          - 液体压强
          - 大气压强
          - 流体压强与流速的关系
          - 压强的综合计算
      - name: 浮力
        points:
          - 浮力与阿基米德原理
          - 物体的浮沉条件
          - 浮力的应用
          - 浮力与压强的综合计算

      # ---- 九年级上册 ----
      - name: 简单机械与功
        points: [杠杆平衡条件, 滑轮与滑轮组, 功与功率, 机械效率]
      - name: 机械能与内能
        points: [动能与势能, 机械能及其转化, 分子热运动, 比热容, 热机效率]
      - name: 电路与欧姆定律
        points: [电路连接与识别, 电流与电流表, 电压与电压表, 电阻与变阻器, 欧姆定律, 串联并联规律]

      # ---- 九年级下册 ----
      - name: 电功与电功率
        points: [电功与电能, 电功率, 焦耳定律与电热, 家庭电路与安全用电]
      - name: 电磁现象
        points: [磁现象与磁场, 电流的磁场, 电磁感应, 电动机与发电机]

  - name: 化学
    textbook: 沪教版
    chapters:
      # ======================================================================
      # 2026-10-18 补全化学词表（原 6 章 22 点 → 15 章 76 点）
      #
      # 【原状】只有九年级上册的六章（物质变化/空气与氧气/物质构成/
      #   化学方程式/水与溶液/金属与酸碱盐）。问题：
      #     1) 「金属与酸碱盐」把九下的金属、酸、碱、盐、复分解五块
      #        压成一章，考点粒度太粗，错题只能落到大桶里，学情诊断
      #        看不出到底错在哪个反应类型上。
      #     2) 九下的「溶液」「化学与生活」「实验探究」几乎完全空白。
      #     3) 「物质的构成」缺原子结构、离子、化学式的意义。
      #
      # 【划分依据】沪教版九年级化学教材（上/下）章节 + 2022 版课标
      #   五个学习主题（科学探究与化学实验 / 物质的性质与应用 /
      #   物质的组成与结构 / 物质的化学变化 / 化学与社会发展）。
      #   章节名用「内容主题」而非教材单元号 —— 理由同历史/道法那段：
      #   教材换版时单元号会变，内容主题不会。代价是粒度比单元粗一点，
      #   这是知情取舍。
      # ======================================================================

      - name: 物质的变化与实验基础
        points:
          - 物理变化与化学变化
          - 物质的性质与用途
          - 常用仪器与基本操作
          - 药品取用与加热
          - 过滤与蒸发
          - 实验安全与事故处理
      - name: 空气与氧气
        points:
          - 空气的组成
          - 空气的污染与防治
          - 氧气的性质
          - 氧气的制取
          - 催化剂与催化作用
          - 燃烧的条件与灭火
          - 缓慢氧化与爆炸
      - name: 物质构成的奥秘
        points:
          - 分子与原子
          - 原子的结构与离子
          - 元素与元素符号
          - 化学式与化合价
          - 相对分子质量与元素质量分数
          - 物质的分类（单质/化合物/氧化物）
      - name: 化学方程式
        points:
          - 质量守恒定律
          - 化学方程式的书写与配平
          - 根据化学方程式的计算
          - 含杂质的计算
      - name: 水与溶液
        points:
          - 水的组成与净化
          - 硬水与软水
          - 溶液的形成与溶解现象
          - 饱和溶液与不饱和溶液
          - 溶解度与溶解度曲线
          - 溶质质量分数的计算
          - 溶液的配制与稀释
          - 结晶与分离提纯
      - name: 金属与金属材料
        points:
          - 金属的物理性质与用途
          - 金属的化学性质
          - 金属活动性顺序
          - 置换反应
          - 金属的冶炼
          - 金属资源的保护与防锈
      - name: 酸碱盐
        points:
          - 酸的性质
          - 碱的性质
          - 溶液的酸碱性与pH
          - 中和反应及其应用
          - 盐的性质与复分解反应
          - 常见离子的检验
          - 复分解反应发生的条件
          - 酸碱盐的综合推断
      - name: 碳和碳的氧化物
        points:
          - 碳单质的性质与用途
          - 二氧化碳的性质与制取
          - 一氧化碳的性质
          - 碳循环与温室效应
      - name: 化学与能源、材料、健康
        points:
          - 燃烧与能源利用
          - 燃料与化石能源
          - 化学与材料
          - 化学与人体健康
          - 化学与环境保护
      - name: 化学实验探究
        points:
          - 气体制取装置的选择
          - 气体的检验与除杂
          - 物质的鉴别与推断
          - 实验方案的设计与评价
          - 实验数据的处理与分析

  - name: 英语
    textbook: 译林版
    chapters:
      # ======================================================================
      # 2026-10-18 补全英语词表（原 4 章 18 点 → 9 章 76 点）
      #
      # 【原状】4 章：时态与语态 / 从句 / 其他语法 / 语言技能。
      #   问题：
      #     1) 「语言技能」一章只有「词汇拼写/完形填空/阅读理解/书面表达」
      #        4 个点，而题库里英语错题 84 道，题型远不止这四种
      #        （填空题 25 道、解答题 7 道、多选题 7 道）。
      #     2) 语法层缺词法：名词单复数、冠词、代词、数词、形容词副词、
      #        构词法 —— 这些恰恰是初中英语错题最密集的地方。
      #     3) 从句只有宾/定/状三类，没有「连词」「直接引语与间接引语」
      #        「感叹句、祈使句、疑问句」这些句式考点。
      #     4) 缺「情景交际」和「语音」。
      #
      # 【划分】语法按「词法 → 句法 → 从句 → 特殊句式」四层，
      #   技能按「听力/口语/阅读/写作」+ 中考题型。
      #   原有 4 章、18 个考点名全部保留。
      # ======================================================================

      - name: 时态与语态
        points: [一般现在时与现在进行时, 一般过去时与过去进行时, 一般将来时, 现在完成时, 被动语态]
      - name: 从句
        points: [宾语从句, 定语从句, 状语从句]
      - name: 其他语法
        points: [情态动词, 非谓语动词, 主谓一致, 比较级与最高级, 介词与固定搭配, 词义辨析]
      - name: 语言技能
