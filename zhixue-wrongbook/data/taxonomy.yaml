  - name: 物理
    textbook: 苏科版
    chapters:
      # ======================================================================
      # 2026-10-18 全面重建物理词表
      #
      # 【起因】原词表只有 7 章，而且是「内容相同就合章」的写法 ——
      #   声与光（八上 声+光+透镜）、物态变化（八上）、简单机械（九上）、
      #   机械能与内能（九上）、电路与欧姆定律（九上）、电功与电功率（九下）、
      #   电磁现象（九下）。
      #   问题有两个：
      #     1) 八上的「物体的运动」「质量与密度」「力」「力与运动」「压强」「浮力」
      #        六章整章缺失 —— 八年级错题无处归类，分析提交会被闸门拒绝。
      #        实测就是这么卡住的：s-t 图题、平均速度题全部落到词表外。
      #     2) 「声与光」一章塞了声音、光的直线传播、反射、折射、平面镜、
      #        凸透镜成像共 8 个考点，横跨三章教材内容。
      #        用户要求「补全」，实际需要的是按教材章节拆开、逐章补内容。
      #
      # 【现在的划分】按苏科版教材章节走，八上 → 八下 → 九上 → 九下 顺序：
      #   八上：声现象 / 物态变化 / 光现象 / 透镜及其应用 /
      #         物体的运动 / 质量与密度
      #   八下：力 / 力与运动 / 压强 / 浮力
      #   九上：简单机械与功 / 机械能与内能 / 电路与欧姆定律
      #   九下：电功与电功率 / 电磁现象
      #
      # 【兼容性 —— 这一点很重要】
      # 拆掉了原来的「声与光」一章，但**原有的 8 个考点名一个字都没改**
      # （声音的产生与传播 / 乐音特性 / 光的直线传播 / 光的反射 / 光的折射 /
      #   平面镜成像 / 凸透镜成像规律 / 科学探究方法），只是搬到了新章节下面。
      # 词表校验同时接受「学科/章节/知识点」三段 和 「章节/知识点」两段
      # 两种写法，所以旧分析结果里的路径依然能命中，不会失效。
      # 唯一失效的是「声与光」这个**章节名**本身 —— 但章节名从不写进
      # 分析结果（knowledge_points 存的是完整路径，章节是中间段）。
      # 提交前实测确认过：历史分析全部仍可校验通过。
      # ======================================================================

      # ---- 八年级上册 ----
