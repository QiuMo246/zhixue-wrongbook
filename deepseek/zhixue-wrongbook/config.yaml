# 项目配置。改这里不用改代码。
#
# 这个文件的存在原因：有些值必须由「拿到真实数据的人」来填，
# 而不是由写代码的人拍脑袋。填之前相关的闸门会自动降级为「未校验」，
# 并明确告诉你哪一项没校验——不会假装通过。

difficulty:
  # 平台 difficulty 的刻度。核实报告 §3.1：
  #   zhixuewang 的 ErrorBookTopic.difficulty 类型是 int，刻度未知。
  # 可选值：
  #   unknown —— 默认。难度闸门降级为软参考（不假装有阈值）
  #   raw     —— 已知是整数刻度，请同时填 assumed_max
  #   0-1     —— 已确认是 0~1 浮点，闸门按 ±0.15 正常生效
  scale: raw
  # 当 scale=raw 时必填：平台刻度的上限。
  #
  # 实测依据（2026-09-24，真实账号）：
  #   采样 30 场考试 / 314 道错题，difficulty 取值只有 {0, 1, 2, 3}，
  #   类型全部是 int，**从未出现 4 或 5**（314 个样本足够排除）。
  #   交叉验证它是有意义的序数刻度 —— 按班级得分率：
  #     难度 3 → 0.406（最难）   难度 2 → 0.703
  #     难度 1 → 0.921           难度 0 → 0.756
  #   难度 3 的得分率显著最低，且占错题的 43%，与「最难」一致。
  #   结论：刻度是 **0~3**（4 级），所以上限填 3。
  #   若日后真实数据里出现 4 或 5，说明平台改了刻度，请重新校准这一项。
  assumed_max: 3
  # 填这个值的人 + 日期，留痕用（换人/换时间后能追溯阈值是谁定的）
  verified_by: "末秋（AI 助手）代为核实，数据来自秋末的真实账号"
  verified_at: "2026-09-24"

data:
  db_path: data/wrongbook.db
  images_dir: data/images
  taxonomy: data/taxonomy.yaml

host:
  # 宿主模型标识，会写进 analysis.analyzed_by，用于可追溯
  # 换模型后，旧分析结果仍能看出是哪一版模型产生的
  model_id: "host:unknown"
  prompt_version: "analyze-v3"

sync:
  # 单次同步最多拉多少场考试（防止第一次跑把几年的数据全拉下来）
  max_exams: 20
  # 同步时是否下载图片到本地（关闭则只记 URL）
  download_images: true
